<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スロット</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; color: #ffd700; }
    .subtitle { margin-bottom: 24px; font-size: 13px; opacity: 0.5; }
    #player-info { margin-bottom: 30px; font-size: 14px; opacity: 0.8; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    .btn-win { background: #2ecc71; color: white; }
    .btn-draw { background: #f39c12; color: white; }
    .btn-close { background: #e74c3c; color: white; }
    #status { margin-top: 20px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>🎰 スロット</h1>
  <div class="subtitle">(Stub - 実装予定)</div>
  <div id="player-info">プラットフォームからの開始待ち...</div>
  <div class="btn-group">
    <button class="btn-win" id="btn-win">勝利を送信</button>
    <button class="btn-draw" id="btn-draw">引き分けを送信</button>
    <button class="btn-close" id="btn-close">ゲームを閉じる</button>
  </div>
  <div id="status"></div>

  <script>
    // ============================================================
    // Game Plaza Platform SDK
    // ============================================================

    const GamePlazaSDK = {
      players: [],
      localPlayer: null,
      gameType: null,

      init(onGameStart) {
        window.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || data.type !== 'game_start') return;

          this.players = data.players || [];
          this.localPlayer = this.players.find(p => p.isLocal) || null;
          this.gameType = data.gameType;

          if (onGameStart) {
            onGameStart({
              gameType: data.gameType,
              players: this.players,
              localPlayer: this.localPlayer,
            });
          }
        });
      },

      sendResult(winnerId, scores = {}) {
        window.parent.postMessage({
          type: 'game_result',
          winnerId: winnerId,
          scores: scores,
        }, '*');
      },

      sendClose() {
        window.parent.postMessage({ type: 'game_close' }, '*');
      },
    };

    // ============================================================
    // ゲームロジック
    // ============================================================

    GamePlazaSDK.init(({ gameType, players }) => {
      const names = players.map(p => p.userName || p.uuid.slice(0, 8)).join(', ');
      document.getElementById('player-info').textContent = `プレイヤー: ${names}`;
      document.getElementById('status').textContent = 'ゲーム開始！';
    });

    document.getElementById('btn-win').addEventListener('click', () => {
      const winnerId = GamePlazaSDK.localPlayer?.uuid || null;
      GamePlazaSDK.sendResult(winnerId);
      document.getElementById('status').textContent = '✅ 結果送信: 勝利';
    });

    document.getElementById('btn-draw').addEventListener('click', () => {
      GamePlazaSDK.sendResult(null);
      document.getElementById('status').textContent = '✅ 結果送信: 引き分け';
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      GamePlazaSDK.sendClose();
      document.getElementById('status').textContent = '✅ ゲーム終了';
    });
  </script>
</body>
</html>
