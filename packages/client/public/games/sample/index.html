<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプルゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; color: #ffd700; }
    .subtitle { margin-bottom: 24px; font-size: 13px; opacity: 0.5; }
    #player-info { margin-bottom: 30px; font-size: 14px; opacity: 0.8; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    .btn-win { background: #2ecc71; color: white; }
    .btn-draw { background: #f39c12; color: white; }
    .btn-close { background: #e74c3c; color: white; }
    #status { margin-top: 20px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>🎮 サンプルゲーム</h1>
  <div class="subtitle">このファイルを参考に外部ゲームを作成できます</div>
  <div id="player-info">プラットフォームからの開始待ち...</div>
  <div class="btn-group">
    <button class="btn-win" id="btn-win">勝利（スコア100）</button>
    <button class="btn-draw" id="btn-draw">引き分け</button>
    <button class="btn-close" id="btn-close">ゲームを閉じる</button>
  </div>
  <div id="status"></div>

  <script>
    // ============================================================
    // Game Plaza Platform SDK
    // 外部ゲームがプラットフォームと通信するための共通インターフェース
    // ============================================================

    const GamePlazaSDK = {
      players: [],
      localPlayer: null,
      gameType: null,

      /**
       * 初期化: プラットフォームからの game_start メッセージを待ち受ける
       * @param {function} onGameStart - ゲーム開始時のコールバック
       */
      init(onGameStart) {
        window.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || data.type !== 'game_start') return;

          this.players = data.players || [];
          this.localPlayer = this.players.find(p => p.isLocal) || null;
          this.gameType = data.gameType;

          if (onGameStart) {
            onGameStart({
              gameType: data.gameType,
              players: this.players,
              localPlayer: this.localPlayer,
            });
          }
        });
      },

      /**
       * ゲーム結果を送信する
       * @param {string|null} winnerId - 勝者のUUID（引き分けはnull）
       * @param {Object} [scores] - スコア情報（プレイヤーUUID → スコア）
       */
      sendResult(winnerId, scores = {}) {
        window.parent.postMessage({
          type: 'game_result',
          winnerId: winnerId,
          scores: scores,
        }, '*');
      },

      /**
       * ゲームを閉じる（結果なし）
       */
      sendClose() {
        window.parent.postMessage({ type: 'game_close' }, '*');
      },
    };

    // ============================================================
    // ゲームロジック（ここを書き換えてゲームを実装する）
    // ============================================================

    GamePlazaSDK.init(({ gameType, players, localPlayer }) => {
      const names = players.map(p => p.userName || p.uuid.slice(0, 8)).join(', ');
      document.getElementById('player-info').textContent =
        `ゲーム: ${gameType} | プレイヤー: ${names}`;
      document.getElementById('status').textContent = 'ゲーム開始！';
    });

    document.getElementById('btn-win').addEventListener('click', () => {
      const uuid = GamePlazaSDK.localPlayer?.uuid || 'unknown';
      // スコアを送信（scoresのキーはプレイヤーUUID、値はスコア数値）
      GamePlazaSDK.sendResult(uuid, { [uuid]: 100 });
      document.getElementById('status').textContent = '✅ 結果送信: 勝利（100点）';
    });

    document.getElementById('btn-draw').addEventListener('click', () => {
      GamePlazaSDK.sendResult(null);
      document.getElementById('status').textContent = '✅ 結果送信: 引き分け';
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      GamePlazaSDK.sendClose();
      document.getElementById('status').textContent = '✅ ゲーム終了';
    });
  </script>
</body>
</html>
